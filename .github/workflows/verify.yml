# The full gate on every push and pull request (AGENTS.md section 9): scripts/verify.sh inside the pinned image.
name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ccc .
      - run: docker run --rm ccc
