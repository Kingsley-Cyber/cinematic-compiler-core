[project]
name = "cinematic-compiler"
version = "0.1.0"
description = "Layer-DAG compiler from a scene request to a validated movement-graph envelope and video-model prompts."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
cinematic = "cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kernel*", "planner*", "validators*", "compiler*", "solver*", "kernel_extraction*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: fast isolated checks", "integration: crosses files or layers"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
