# Scope of every control shared by LBN-2.3-ADV and LBN-2.4-ADV-LMA (the kernel intersection).
# kernel: applies to every scene as written. kernel_actor / kernel_prop: written for the reference
# actors/props (reference_labels) and applied to every declared actor/prop. scene_reference: only the
# reference courtyard fight; kept for fixtures, not applied to other scenes. Edit scopes here, then run
# python -m kernel_extraction.control_inventory and log both files.
version: 1
status: draft
decided_by: owner_default
