         test: tests/test_kinematic_solver.py::test_each_rule_rejects_its_violation}
    note: "Lower never contradicts higher holds for position, facing and posture (S13 vs S04/S06) and support
      (S11 vs S07/S06). Owner O4 (2026-10-11): the repo order stands, so S15 effort is authored from the finished
      keys rather than vetoing them. The prose states 'Laban support and contacts primary; Euler precision override'
