         test: tests/test_temporal_pass.py::test_wrong_packet_and_failed_gates_are_refused}
    note: "An upstream change re-seals every downstream packet (sha256), so a plan bound to the old packet is refused
      and must be re-authored: the cascade is forced. The DAG's worked example (an Effort change softens angles,
      speed, contact and camera) cannot run in the repo, because Effort (S15) sits below motion (see M3)."

  - id: M3
