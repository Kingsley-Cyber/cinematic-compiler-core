         test: tests/test_layer_dependency.py::test_step_ids_must_be_well_formed_unique_and_rise_with_build_order}
    note: "S01 intent has no inputs and every step depends on it; step ids must rise with build order, so nothing
      (joint angles included, S13) can come before intent. The render opens with the query preface."

  - id: M2
    name: Hierarchy + downward cascade
    anchor: "§2.2 L837; §2.3 L1162; §1.2 L53-L54"
