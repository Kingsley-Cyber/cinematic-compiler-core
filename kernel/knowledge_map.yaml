    note: "M9-06a (owners O24, O72, O81): each touch and hold prints the actor's and the target's world points (forward kinematics, solver/contact_world.py); the misses are reported (F-070). M9-06b (plan F5.2, owners O72, O83): S13 refuses a touch, hold or support whose two points lie over 0.15 m apart (CONTACT_WORLD), except a genuine artefact and a source row the motion plan lists with its reason; the prompt prints both points. RV-02a (owner O89, ADR-O104, S-039): a genuine artefact is a point interpolated between keys or samples while the actor is airborne or the prop moves; at an exact instant nothing is exempt and a turn alone never is, so the repo side of each such miss was re-blocked and the source's slide at 5.9 is listed. RV-02b (ADR-O105, S-043): a prop's release is measured too (the prop leaves the hand where the hand is). M9-07a (owner O22, plan F4.1): a contact may carry a combat verb its contact type takes
