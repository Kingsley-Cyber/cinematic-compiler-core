  - id: M4
    name: Model-as-reader contradiction check
    anchor: "§2.2 L839; §2.3 L1170; §1.2 L62; §2.5 L210"
    class: mandatory
    step: all
    status: enforced
    codes: [PROMPT_CONTRADICTION, SECTION_MISSING, SECTION_ORDER,
            DOUBLED_WORD, COUNT_CONTRADICTION, VANISHED_BODY, TURN_LABEL,
            BODY_HOLD_FRAMES, EMPTY_HAND_UNSTATED, ROTATION_ANGLES_PRINTED, HIDDEN_PHRASING, ROTATION_PATH_UNSTATED]
    enforced_by:
      - {file: solver/euler_solver.py, check: named_turn_findings, code: TURN_LABEL,
         test: tests/test_motion_solver.py::test_each_rule_rejects_its_violation}
      - {file: planner/dynamic_beat_validator.py, check: _vanished, code: VANISHED_BODY,
         test: tests/test_dynamic_beat_validator.py::test_a_vanished_body_lets_go_of_its_supports_and_holds}
      - {file: validators/prompt_validator.py, check: _turn_checks, code: ROTATION_PATH_UNSTATED,
         test: tests/test_motion_solver.py::test_a_spin_is_written_once_like_a_named_flip}
      - {file: compiler/passes/derived/p17_render.py, check: check, code: RENDER_COVERAGE,
         test: tests/test_render.py::test_a_dropped_item_fails_coverage}
    note: "M9 W1-W4 (owner O47-O49; probes R10-R18): the wording the model followed is the rule. No hold or freeze is written in frames; a hit gets a camera hold with the bodies in frame, no close-up (BODY_HOLD_FRAMES). A hand that releases and then holds nothing is said to be empty (EMPTY_HAND_UNSTATED). A turn is named once, by axis, plane and count, with takeoff and landing; no angles at times, no rate, no angles on the lines inside it (ROTATION_ANGLES_PRINTED). No prop is called hidden or not visible; a later object stands in the scene from the start (HIDDEN_PHRASING, O48). M8.12 (owner O18, audit X5/X6): a beat that names a flip or a cartwheel has its actor declare that turn, and the staff writes it (TURN_LABEL; S13 named_turn_findings). M8.12 (owner O18, audit X9): a substituted body has no line, pose or support until it reappears, and RULES say so (VANISHED_BODY; S04 refuses a beat that lists it). RV-06 (owner O90): S04 also refuses a vanished body's support or hold left open while it is gone. Two counts that disagree are a reader contradiction (COUNT_CONTRADICTION, M8.12). M8.12: a word written twice in a row is a reading defect (DOUBLED_WORD; F8's 'rope dart dart'). M8.4: validators/prompt_validator.py reads each prose prompt whole and compares every section with the
      envelope and with each other (staff contacts vs prop state machines, causal order vs times, FX vs negatives).
      All four examples pass with nothing set aside (owner O10: reference_fight's 'dust ring' fx now read 'dust
      burst', audit X29)."

