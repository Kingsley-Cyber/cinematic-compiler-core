# Knowledge-DAG map (owner request 2026-10-11): every node of the frozen knowledge DAG
# (docs/sources/knowledge_dag_v1.md, never edited) attached to the S01-S17 step that owns it.
# Owner, 2026-10-11: the DAG is the compiler and workflow for writing the owner's prompts in structured prose;
# it details the dependency chains and the graph QA/QC for the final outputs, in its final form.
# kernel/layer_order.yaml stays the single source of steps; this file adds no step, rule or check.
# Owner decisions already in the repo override the DAG: a clash is recorded here as clashes_with_repo
# and goes to the owner as a question, never into code. tests/test_knowledge_map.py guards this file.
#
# class:
#   mandatory  - true in every compile; a violation fails the gate (exit 4, replan)
#   required   - must be present for the active genre; a missing authored step is exit 3
#   style      - genre or mode choice; lives in library cards, checked as ranges
#   projection - S17 render wording only
#   evidence   - metrics, instances, failure modes, owner render results; never enforced
#   excluded   - P3.2 / P4.2 items the DAG deliberately did not add
# status:
#   enforced          - a check function plus a test that fails when the rule is broken (enforced_by)
#   partial           - part of it is checked or present (enforced_by lists what exists), or no failing test
#   missing           - nothing in the repo yet
#   clashes_with_repo - an owner decision in the repo says otherwise; the owner's call
#   excluded          - left out by the DAG; the note says where the repo stands
# Evidence rows are never enforced: partial means the repo holds or mitigates part of it.
# A locator is {file, check (function in file), code (finding code), test (tests/file.py::function)}.
# Anchors are line numbers in the frozen copy (§2.2 = Mermaid block, §2.3 = node catalogue).
# X1-X41 (§3.5) are findings about specific prompts, not rules, and are not mapped.

