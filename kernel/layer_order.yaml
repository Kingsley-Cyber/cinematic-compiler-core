# Single source of truth for the cinematic-compiler layer DAG.
#
# Each node is one graph build (a pass). `step_id` is its ordered ID (S01, S02 ...)
# and is the only thing that encodes order; tests check that step IDs increase
# along the build order the edges produce. `band` is the owner's name for the
# node's band (L0, L0.5, L1 ...) and carries no order. Pass file names, the
# envelope schema and the validators are checked against this file.
#
# Owner decisions 2026-10-10 (see docs/plans/MASTER_PLAN.md, "Decided this round"):
#   - Effort (L5) is built before camera (L5.5); camera depends on motion + effort.
#   - Entity definitions (entities, props, surfaces) are L0.5; state tracks (states, contacts) L2.
#   - Bands: temporal and causal share L1; state and contact share L2.
#   - Order lives in step IDs; constraint has no L number (band `constraint`) and runs
#     after L0.5, before the event graphs, which depend on it.
#   - UGC steps chain: hand_role -> object_state -> affordance.
#   - S01 writes /intent; S02 writes /scene, except carve-outs owned by later steps:
#     /scene/duration_s and /scene/duration_source (S04), /scene/quadrant (S05).
#     The most specific owner wins; an inner owner always runs after the outer one.
#   - S04 also writes edges.beat_constraint (beats -> constraints).
#   - nodes.render is a projection group (no edges); L6.5 writes validation.post_generation.
#
# `depends_on` lists data inputs. `validated_by: constraint` also orders the
# node after the constraint graph, because that check reads it.
# `when` limits a node to the listed modalities; edges to an inactive node are
# dropped, and only conditional nodes may be inactive.
# `edge_endpoints` names the node groups each edge group connects; `scene` stands for
# the scene itself. Endpoints must be written at or before the edge group's step.

version: "1.6"
kernel: LBN-2.4
envelope: MGRAPH-1.1
modalities: [live_action, anime, ugc_ad]

# Envelope paths written outside any layer pass (pipeline and validators).
pipeline_owned: [/graph_version, /derived_from, /provenance, /validation/schema, /validation/invariants,
                 /validation/layer_dependency, /validation/camera_kinematic_coupling]

edge_endpoints:
  constraint_application: {from: [constraints], to: [scene, entities, props]}
  beat_constraint: {from: [beats], to: [constraints]}
  temporal: {from: [beats], to: [beats]}
  causal: {from: [beats], to: [beats]}
  state_transition: {from: [states], to: [states]}
  contact: {from: [contacts], to: [contacts]}
  hand_role_transition: {from: [hand_role], to: [hand_role]}
  object_state_transition: {from: [object_state], to: [object_state]}
  affordance_dependency: {from: [affordance], to: [affordance]}
  kinematic_transition: {from: [kinematic], to: [kinematic]}
  bartenieff_transition: {from: [bartenieff], to: [bartenieff]}
  motion: {from: [motion], to: [motion]}
  effort: {from: [efforts], to: [efforts]}
  camera: {from: [camera], to: [camera]}

nodes:
  - id: intent
    step_id: S01
    band: L0
    builds: Intent Document
    depends_on: []
    external_inputs: [user_query]
    validated_by: [schema]
    writes: [/intent]

  - id: brief
    step_id: S02
    band: L0.5
    builds: Expanded brief (entity, prop and surface definitions; world grounding)
    depends_on: [intent]
    external_inputs: [library/ontology, library/archetypes, library/worlds, schemas/modality]
    validated_by: [schema, coherence]
    writes: [/scene, /nodes/entities, /nodes/props, /nodes/surfaces]

  - id: constraint
    step_id: S03
    band: constraint
    builds: Constraint graph (kernel + world + archetype invariants)
    depends_on: [brief]
    external_inputs: [kernel/invariants.yaml]
    validated_by: [schema]
    writes: [/nodes/constraints, /edges/constraint_application, /invariants]

  - id: temporal
    step_id: S04
    band: L1
    builds: Temporal graph (authored beat plan)
    depends_on: [brief, constraint]
    validated_by: [schema, invariants, constraint]
    writes: [/nodes/beats, /edges/temporal, /edges/beat_constraint, /scene/duration_s, /scene/duration_source]

  - id: causal
    step_id: S05
    band: L1
    builds: Causal graph and scene quadrant
    depends_on: [temporal]
    validated_by: [schema, invariants, constraint]
    writes: [/edges/causal, /scene/quadrant]

  - id: state
    step_id: S06
    band: L2
    builds: State graph (state tracks of L0.5 definitions)
    depends_on: [temporal, causal]
    validated_by: [schema, invariants, constraint]
    writes: [/nodes/states, /edges/state_transition]

  - id: contact
    step_id: S07
    band: L2
    builds: Contact graph
    depends_on: [temporal, causal, state]
    validated_by: [schema, invariants, constraint]
    writes: [/nodes/contacts, /edges/contact]

  - id: hand_role
    step_id: S08
    band: L2.5
    builds: Hand-role graph
    when: [ugc_ad]
    depends_on: [contact]
    external_inputs: [library/ontology]
    validated_by: [schema, invariants, constraint]
    writes: [/nodes/hand_role, /edges/hand_role_transition]

  - id: object_state
    step_id: S09
    band: L2.6
    builds: Object-state graph
    when: [ugc_ad]
    depends_on: [hand_role]
    external_inputs: [library/ontology, library/affordances]
    validated_by: [schema, invariants, constraint]
    writes: [/nodes/object_state, /edges/object_state_transition]

  - id: affordance
    step_id: S10
    band: L2.7
    builds: Affordance graph
    when: [ugc_ad]
    depends_on: [object_state]
    validated_by: [schema, invariants, constraint]
    writes: [/nodes/affordance, /edges/affordance_dependency]

  - id: kinematic
    step_id: S11
    band: L4a
    builds: Kinematic graph (visible bodily organization)
    depends_on: [state, contact, hand_role, object_state, affordance, constraint]
    validated_by: [schema, invariants, constraint]
    writes: [/nodes/kinematic, /edges/kinematic_transition]

  - id: bartenieff
    step_id: S12
    band: L4b
    builds: Bartenieff graph (body coordination patterns)
    depends_on: [kinematic]
    validated_by: [schema, invariants, constraint]
    writes: [/nodes/bartenieff, /edges/bartenieff_transition]

  - id: motion
    step_id: S13
    band: L4c
    builds: Motion graph (Euler key poses, axes, slerp, root trajectories)
    depends_on: [kinematic, bartenieff]
    validated_by: [schema, invariants, constraint]
    writes: [/nodes/motion, /edges/motion]

  - id: effort
    step_id: S15
    band: L5
    builds: Effort graph (LMA Effort factors plus Shape and Space)
    depends_on: [motion]
    validated_by: [schema, invariants, constraint]
    writes: [/nodes/efforts, /edges/effort]

  - id: camera
    step_id: S16
    band: L5.5
    builds: Camera graph (13 subdivisions + motivation)
    depends_on: [motion, effort]
    validated_by: [schema, invariants, constraint, camera_rules]
    writes: [/nodes/camera, /edges/camera]

  - id: render
    step_id: S17
    band: L6
    builds: Prose / render projection (full LBN layout, uncompressed)
    projection: true
    depends_on: [intent, brief, temporal, causal, state, contact, hand_role, object_state,
                 affordance, constraint, kinematic, bartenieff, motion, effort, camera]
    validated_by: [schema, invariants, constraint]
    writes: [/nodes/render]

  - id: post_generation
    step_id: S18
    band: L6.5
    builds: Post-generation report (only when a video model is available)
    depends_on: [render]
    external_inputs: [generated_video]
    validated_by: [pose, object, state, affordance]
    writes: [/validation/post_generation]
