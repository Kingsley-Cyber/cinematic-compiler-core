card_id: ugc_ad
kind: camera_convention
card_version: 2
status: draft
genre: ugc_ad
description: "UGC ad: phone-native handheld or gimbal coverage, jump cuts allowed, the product shown in use; the axis is never crossed."
transitions: [open, cut, jump_cut, match_cut]
playback: [normal]  # PLAYBACK_RAMP for every scene (S-050's reading of owner O92; RV-60)
rigs: [handheld, gimbal, tripod]
max_roll_deg: 10
shot_duration_s: [0.4, 4.0]
cross_line: forbidden
required_intents: [product]
conventions:
  - {id: ugc_hook_first, statement: "The first shot carries the hook or the product."}
  - {id: ugc_hand_object, statement: "Every product use shows the hand on the object."}
  - {id: ugc_lens_eyeline, statement: "Talking-to-camera shots keep the eyeline in the lens."}
provenance:
  authored_by: claude-code
  date: "2026-10-10"
  basis: Draft camera convention (owner camera plan); not research-sourced; needs owner review.
