card_id: live_action
kind: camera_convention
card_version: 1
status: draft
genre: live_action
description: "Live-action coverage: cut on action, matched movement across cuts, slow motion only at a peak."
transitions: [open, cut, match_cut, smash_cut, whip_pan, dissolve]
playback: [normal, slow, ramp]
rigs: [tripod, dolly, crane, gimbal, steadicam, handheld, drone]
max_roll_deg: 20
shot_duration_s: [0.4, 10.0]
cross_line: allowed
required_intents: []
conventions:
  - {id: live_establishing_wide, statement: "Establish the space before the action needs it."}
  - {id: live_cut_on_action, statement: "Cut during the movement and match it across the cut."}
  - {id: live_slow_peak, statement: "Slow motion only around the peak of an action."}
provenance:
  authored_by: claude-code
  date: "2026-10-10"
  basis: Draft camera convention (owner camera plan); not research-sourced; needs owner review.
