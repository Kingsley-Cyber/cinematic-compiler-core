    basis: "S-027 draft: one adult of about 1.75 m, standing pelvis 0.98 m above the soles (thigh + shin + ankle), rounded from common anthropometric proportions, not measured from a source."
    metres: {hip: 0.10, thigh: 0.45, shin: 0.45, ankle: 0.08, spine: 0.50, torso_point: 0.8, shoulder: 0.18,
             upper_arm: 0.30, forearm: 0.35, neck: 0.10, head: 0.11}
  anime:
    basis: "S-029 (O82, O85): the adult with its leg scaled x1.25 (standing pelvis 1.22 m), the one scale that best puts the soles of the source's grounded A rows (kernel/sources/lbn-2.3-adv.txt, support=both feet on the ground) on the ground with the hips read from the trunk (O84); the upper body is the adult's."
    metres: {hip: 0.10, thigh: 0.56, shin: 0.56, ankle: 0.10, spine: 0.50, torso_point: 0.8, shoulder: 0.18,
             upper_arm: 0.30, forearm: 0.35, neck: 0.10, head: 0.11}
