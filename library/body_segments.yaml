# Draft by Claude for owner review. Each genre profile (library/genre_profiles/<genre>.yaml) names its body_type.
library_id: body_segments
version: 4
status: draft
basis: "Owner O24, O72, O84 and O85; PLAN-003 F5.1 (segment lengths per archetype or body mode)."
bodies:
