# The reference fight's recorded deviations from its source (kernel/sources/lbn-2.3-adv.txt), typed and numbered
# (rules R-17 and R-33; docs/prompts/no_shortcuts.md: a fix that changes an example records a typed deviation, and every
# deviation matches its ADR). One entry per record in tests/test_reference_fight_golden.py, which refuses a record with
# no entry, a type not listed here, or a ruling with no ADR file. Deviations the golden test does not yet record (the
# camera's re-authoring, B's joints, the props' points) are RV-51's (F-147).
version: 1
types:
  reworded: the source's words changed
  renumbered: the source's own numbers changed (A's rows)
  re-blocked: a repo-authored number moved so a check holds (B, the props)
  added: data the source does not give, authored by the repo
  retimed: an event moved in time
  dropped: something the source gives is left out
  kept: a real miss the owner keeps as the source wrote it
aggregates: {REWORDED: [DEV-01, DEV-02, DEV-03, DEV-04], WORDS: [DEV-13, DEV-14, DEV-15]}
deviations:
  - {id: DEV-01, record: PREFACE_RECOUNTED, type: reworded, rulings: [ADR-O17], what: "the query counts the substitution log, the fifth prop"}
  - {id: DEV-02, record: GROUNDED_RULES, type: reworded, rulings: [ADR-O18], what: "the pickups' rules say A lands crouched by the rope dart and takes the kunai from the ground"}
  - {id: DEV-03, record: START_HEIGHT, type: reworded, rulings: [ADR-O79, ADR-O21], what: "A starts above the frame, falling from y=10"}
  - {id: DEV-04, record: VANISH_RULE, type: reworded, rulings: [ADR-O90], what: "the rope dart is left on the ground at the vanish, taken again at 7.5"}
  - {id: DEV-05, record: WORD_FLIPS, type: renumbered, rulings: [ADR-O88, ADR-O7, ADR-O10, ADR-O11], what: "A's limb numbers flipped to the source's own words; knees read +|x|; two hips held at the anime limit"}
  - {id: DEV-06, record: HEAD_FLIPS, type: renumbered, rulings: [ADR-O88], what: "A's head pitch flipped to the source's words"}
  - {id: DEV-07, record: VANISHED, type: dropped, rulings: [ADR-O18], what: "A's 4.0 row is not drawn: A is gone from 3.7 to 4.4"}
  - {id: DEV-08, record: ROOT_TURNS, type: renumbered, rulings: [ADR-O18], what: "angles stay continuous after the backflip and the cartwheel"}
  - {id: DEV-09, record: GROUNDED_PICKUPS, type: renumbered, rulings: [ADR-O18, ADR-O83, ADR-O89], what: "A's rows at the two pickups crouch on the ground and reach the props"}
